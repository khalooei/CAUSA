<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="340" rx="14" fill="#fcfcfb" stroke="#e1e0d9"/>

  <!-- input -->
  <rect x="24" y="118" width="150" height="104" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="99" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Audio clip x</text>
  <path d="M42,178 l6,-14 l6,26 l6,-30 l6,34 l6,-22 l6,12 l6,-6 l6,10 l6,-18 l6,22 l6,-12 l6,6 l6,-4 l6,4 l6,-8 l6,10 l6,-4" fill="none" stroke="#898781" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="99" y="208" text-anchor="middle" font-size="12.5" fill="#52514e">claim: "sound of o"</text>

  <!-- CLAP -->
  <line x1="174" y1="170" x2="212" y2="170" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="214" y="118" width="150" height="104" rx="10" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="289" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">CLAP localize</text>
  <rect x="232" y="160" width="114" height="22" rx="3" fill="#f4f3ef"/>
  <rect x="290" y="160" width="32" height="22" rx="3" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="289" y="208" text-anchor="middle" font-size="12.5" fill="#52514e">best window R(o)</text>

  <!-- interventions -->
  <line x1="364" y1="170" x2="384" y2="170" stroke="#52514e" stroke-width="1.6"/>
  <path d="M384,52 V288" stroke="#52514e" stroke-width="1.6" fill="none"/>
  <g font-size="13">
    <line x1="384" y1="52" x2="402" y2="52" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="404" y="30" width="226" height="44" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="404" y="30" width="6" height="44" rx="3" fill="#2a78d6"/>
    <text x="420" y="49" font-weight="600" fill="#0b0b0b">Remove R(o)</text>
    <text x="420" y="66" font-size="12" fill="#52514e">necessity: do(R(o) := empty)</text>

    <line x1="384" y1="130" x2="402" y2="130" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="404" y="108" width="226" height="44" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
    <rect x="404" y="108" width="6" height="44" rx="3" fill="#eb6834"/>
    <text x="420" y="127" font-weight="600" fill="#0b0b0b">Remove a random window</text>
    <text x="420" y="144" font-size="12" fill="#52514e">same length: does location matter?</text>

    <line x1="384" y1="208" x2="402" y2="208" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="404" y="186" width="226" height="44" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.6"/>
    <rect x="404" y="186" width="6" height="44" rx="3" fill="#898781"/>
    <text x="420" y="205" font-weight="600" fill="#0b0b0b">All-zero audio</text>
    <text x="420" y="222" font-size="12" fill="#52514e">the AAD contrast</text>

    <line x1="384" y1="288" x2="402" y2="288" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="404" y="266" width="226" height="44" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="420" y="285" font-weight="600" fill="#0b0b0b">No audio block</text>
    <text x="420" y="302" font-size="12" fill="#52514e">the language prior</text>
  </g>

  <!-- LALM -->
  <path d="M630,52 H650 M630,130 H650 M630,208 H650 M630,288 H650 M650,52 V288" stroke="#52514e" stroke-width="1.6" fill="none"/>
  <line x1="650" y1="170" x2="668" y2="170" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="670" y="124" width="122" height="92" rx="10" fill="#0b0b0b"/>
  <text x="731" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Any LALM</text>
  <text x="731" y="176" text-anchor="middle" font-size="12" fill="#c3c2b7">one forward pass</text>
  <text x="731" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">P(yes)</text>

  <!-- outputs -->
  <path d="M792,170 H808 M808,110 V230" stroke="#52514e" stroke-width="1.6" fill="none"/>
  <line x1="808" y1="110" x2="822" y2="110" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="808" y1="230" x2="822" y2="230" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="824" y="80" width="116" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="882" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Detect</text>
  <text x="882" y="123" text-anchor="middle" font-size="11.5" fill="#52514e">ungrounded claims</text>
  <rect x="824" y="200" width="116" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
  <text x="882" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Correct</text>
  <text x="882" y="243" text-anchor="middle" font-size="11.5" fill="#52514e">contrastive decoding</text>
</svg>
